<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Counterfactual Shield overview</title>
<desc id="desc">A proposed action chain flows through policy, recall, counterfactual risk and evidence gates before receiving a scoped execution grant.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071427"/><stop offset="1" stop-color="#102a43"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<text x="70" y="85" fill="#f5f7fa" font-family="system-ui,sans-serif" font-size="44" font-weight="700">Counterfactual Shield</text>
<text x="72" y="124" fill="#9fb3c8" font-family="system-ui,sans-serif" font-size="19">Prospective authorization for autonomous action chains</text>
<g font-family="system-ui,sans-serif" font-size="18" text-anchor="middle">
 <g fill="#16324f" stroke="#4cc9f0" stroke-width="2"><rect x="70" y="190" width="180" height="96" rx="16"/><rect x="330" y="190" width="180" height="96" rx="16"/><rect x="590" y="190" width="180" height="96" rx="16"/><rect x="850" y="190" width="260" height="96" rx="16"/></g>
 <g fill="#f5f7fa"><text x="160" y="228">Action DAG</text><text x="160" y="254" fill="#9fb3c8" font-size="14">typed intent</text><text x="420" y="228">Policy + Recall</text><text x="420" y="254" fill="#9fb3c8" font-size="14">Cedar  -  RuVector</text><text x="680" y="228">Risk + Evidence</text><text x="680" y="254" fill="#9fb3c8" font-size="14">conformal  -  RVF</text><text x="980" y="228">Scoped execution grant</text><text x="980" y="254" fill="#9fb3c8" font-size="14">single use  -  ledgered</text></g>
</g>
<path id="route" d="M250 238 H330 M510 238 H590 M770 238 H850" stroke="#4cc9f0" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="8 10">
 <animate attributeName="stroke-dashoffset" from="36" to="0" dur="1.6s" repeatCount="indefinite"/>
</path>
<circle r="7" fill="#80ffdb" filter="url(#glow)"><animateMotion dur="4.8s" repeatCount="indefinite" path="M250 238 H330 M510 238 H590 M770 238 H850"/></circle>
<g font-family="system-ui,sans-serif" font-size="14" fill="#80ffdb"><text x="70" y="350">RELEASE</text><text x="155" y="350" fill="#9fb3c8">only when policy ' calibrated risk ' evidence integrity hold</text></g>
</svg>