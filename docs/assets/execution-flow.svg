<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Counterfactual Shield execution architecture</title>
<desc id="desc">Four bounded context bands show decision, intelligence, assurance, and runtime crates connected by a vertical execution flow.</desc>
<rect width="1200" height="620" rx="24" fill="#081421"/>
<text x="55" y="62" fill="#f5f7fa" font-family="system-ui,sans-serif" font-size="32" font-weight="700">Evidence-bearing execution flow</text>
<g font-family="system-ui,sans-serif">
 <g fill="#102a43" stroke="#486581"><rect x="55" y="100" width="1090" height="95" rx="14"/><rect x="55" y="215" width="1090" height="95" rx="14"/><rect x="55" y="330" width="1090" height="95" rx="14"/><rect x="55" y="445" width="1090" height="110" rx="14"/></g>
 <g fill="#80ffdb" font-size="17" font-weight="700"><text x="80" y="132">DECISION</text><text x="80" y="247">INTELLIGENCE</text><text x="80" y="362">ASSURANCE</text><text x="80" y="477">RUNTIME + EVIDENCE</text></g>
 <g fill="#d9e2ec" font-size="15">
  <text x="80" y="166">types  -  action  -  resource graph  -  policy model  -  Cedar</text>
  <text x="80" y="281">incidents  -  embedding  -  RuVector  -  counterfactual  -  attribution  -  plan</text>
  <text x="80" y="396">risk control  -  RVF  -  verifier  -  executor gate  -  recovery</text>
  <text x="80" y="512">config  -  telemetry  -  evaluation  -  orchestrator  -  API  -  CLI  -  ledger</text>
 </g>
 <g fill="#4cc9f0"><circle cx="1060" cy="150" r="10"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle><circle cx="1060" cy="265" r="10"><animate attributeName="opacity" values=".25;1;.25" dur="2s" begin=".5s" repeatCount="indefinite"/></circle><circle cx="1060" cy="380" r="10"><animate attributeName="opacity" values=".25;1;.25" dur="2s" begin="1s" repeatCount="indefinite"/></circle><circle cx="1060" cy="500" r="10"><animate attributeName="opacity" values=".25;1;.25" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle></g>
</g>
<path d="M1060 160 V255 M1060 275 V370 M1060 390 V490" stroke="#4cc9f0" stroke-width="3" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.4s" repeatCount="indefinite"/></path>
<text x="55" y="592" fill="#829ab1" font-family="system-ui,sans-serif" font-size="14">Every grant is traceable to a policy receipt, incident recall, counterfactual plan, risk certificate, and RVF witness.</text>
</svg>